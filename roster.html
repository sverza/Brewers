<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="shortcut icon" type="image/x-icon" href="../images/logo_brewers_trimmed.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roster - Brewers</title>
  <link href="https://fonts.cdnfonts.com/css/strike-fighter-laser" rel="stylesheet">
  <style>
    /* --- RESET --- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width:100%; max-width:100%; overflow-x: hidden; }
    img, svg { display:block; max-width:100%; height:auto; }
    a { color: inherit; text-decoration: none; }
    button { border: none; background: none; color: inherit; cursor: pointer; }

    /* --- Stili pagina --- */
    body { font-family: 'Inter', sans-serif; background:#000; color:#fff; }

    /* container dell'header: nessuna regola che interferisca con l'off-canvas */
    #header-container { position: sticky; top: 0; z-index: 1000; background:#090909; width:100%; }

    /* ===== Hero ===== */
.image-section{position:relative;width:100%;max-width:1130px;margin:40px auto 20px}
.image-section img{width:100%;height:auto;display:block;opacity:.6}
.image-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:'Strike Fighter Laser',sans-serif;font-size:clamp(24px,6vw,72px);font-weight:400;line-height:1.2;color:#FEC3C7}
.image-text span:nth-child(2){color:#9AD7F3}
.image-text span:nth-child(3){color:#6BDFDA}
    
    .section-title {
      font-family: 'Strike Fighter Laser', sans-serif;
      font-size: 2.5rem; margin: 2rem 1rem 1rem;
    }

    .filters {
      margin: 0 1rem 1rem;
      display: flex; flex-wrap: wrap; gap: 1rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch; /* evita allargamenti su mobile */
    }
    .filters button {
      background: #222; color: white; font-family: 'Strike Fighter Laser', sans-serif;
      border: none; padding: 0.5rem 1rem; border-radius: 6px; transition: background .3s;
      white-space: nowrap;
    }
    .filters button.active, .filters button:hover { background: #0af; }
    .filters[hidden] { display:none; }
    .roster-picker { display:flex; align-items:center; flex-wrap:wrap; gap:.65rem; margin:1rem; }
    .roster-picker select {
      font:inherit; color:#fff; background:#222; border:1px solid #3aa9ff;
      border-radius:6px; padding:.5rem .75rem; max-width:100%;
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem; padding: 0 1rem 1rem;
    }

    .card {
      position: relative; border-radius: 12px; overflow: hidden;
      background-color:#222; background-size: cover; background-position: center; height: 300px;
      display: flex; align-items: flex-end;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transform: scale(1);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .card:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,0,0,0.7); }
    .card-placeholder { background-size:contain; background-repeat:no-repeat; }

    .card::before {
      content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.5); transition: background .2s;
    }
    .card:hover::before { background: rgba(0,0,0,0.35); }

    .card-content { position: relative; z-index: 1; padding: 1rem; font-family: 'Strike Fighter Laser', sans-serif; }
    .card-content .number { font-size: 2rem; margin-bottom: 0.5rem; }
    .card-content .name { font-size: 1.25rem; line-height: 1.4; overflow-wrap:anywhere; }
    .card-content .role { font-family: 'Inter', sans-serif; font-size: 1rem; opacity: 0.9; }

    .empty-msg {
      margin: 0 1rem 2rem; padding: 0.85rem 1rem;
      border: 1px dashed #3aa9ff; border-radius: 10px;
      color: #9AD7F3; background: rgba(0,85,170,.08);
      font-family: 'Strike Fighter Laser', sans-serif; letter-spacing: .5px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { height: 220px; }
      .filters button { font-size: .8rem; padding: .3rem .6rem; }
      .card-content .number { font-size: 1.5rem; }
      .card-content .name { font-size: 1rem; }
      .card-content .role { font-size: .9rem; }
    }
  </style>
  <script src="ServerCode/content-safety.js"></script>
</head>
<body>

  <div id="header-container"></div>

  <div class="image-section">
    <img src="../images/new_bg_sfondo.png" alt="Basket Brewers" />
    <div class="image-text"><span>WE<br /></span><span>ARE<br /></span><span>BREWERS</span></div>
  </div>

  <div class="roster-picker">
    <label for="roster-season">Stagione del Roster</label>
    <select id="roster-season" disabled></select>
  </div>
  <p id="roster-status" class="empty-msg" role="status">Caricamento del Roster…</p>

  <section id="roster-staff" aria-labelledby="roster-staff-title" hidden>
    <h3 class="section-title" id="roster-staff-title">MASTRI BIRRAI</h3>
    <div class="filters" id="staff-role-filters" hidden></div>
    <div class="grid" id="staff-grid"></div>
  </section>

  <section id="roster-players" aria-labelledby="roster-players-title" hidden>
    <h3 class="section-title" id="roster-players-title">BEVITORI</h3>
    <div class="grid" id="players-grid"></div>
  </section>

  <section id="roster-history" aria-labelledby="roster-history-title" hidden>
    <h3 class="section-title" id="roster-history-title">FUSTI STORICI</h3>
    <div class="grid" id="honorary_members-grid"></div>
  </section>

  <div id="footer-container"></div>

  <script>
    fetch('widget/brewers_header.html')
      .then(r=>{ if(!r.ok) throw new Error('Errore header'); return r.text(); })
      .then(html=>{
        document.getElementById('header-container').innerHTML=html;
        const script = document.createElement("script");
        script.src = "ServerCode/brewers_header.js?v=phase1";
        document.body.appendChild(script);
        const icon = document.getElementById('menu-icon');
        const iconFixed = document.getElementById('menu-icon-fixed');
        const menu = document.getElementById('brewers-menu');
        const overlay = document.getElementById('menu-overlay');
        function toggleMenu(){
          if(!menu||!overlay) return;
          const opening = !menu.classList.contains('open');
          menu.classList.toggle('open');
          overlay.classList.toggle('active');
          if(icon) icon.classList.add('bounce');
          if(iconFixed) iconFixed.classList.add('bounce');
          setTimeout(()=>{ icon&&icon.classList.remove('bounce'); iconFixed&&iconFixed.classList.remove('bounce'); },500);
          if(iconFixed) iconFixed.style.display = opening ? 'block' : 'none';
        }
        icon && icon.addEventListener('click', toggleMenu);
        iconFixed && iconFixed.addEventListener('click', toggleMenu);
        overlay && overlay.addEventListener('click', ()=>{
          menu && menu.classList.remove('open');
          overlay && overlay.classList.remove('active');
          if(iconFixed) iconFixed.style.display='none';
        });
      })
      .catch(err=>console.error('Header:',err));
    
    fetch('widget/brewers_footer.html')
      .then(r=>r.text()).then(d=>document.getElementById('footer-container').innerHTML=d);

    const select = document.getElementById('roster-season');
    const status = document.getElementById('roster-status');
    const staffRoles = new Map([['coach', 'Coach'], ['assistant-coach', 'Assistente']]);

    async function loadRosterData(file) {
      const response = await fetch('roster/multiseason/' + file + '.json');
      if (!response.ok) throw new Error('Roster non disponibile');
      const data = await response.json();
      if (data.schemaVersion !== 1) throw new Error('Versione Roster non supportata');
      return data;
    }

    function renderCards(gridId, cards, people, season) {
      document.getElementById(gridId).innerHTML = cards.map(row => {
        const person = people.get(row.personId);
        if (!person) throw new Error('Profilo Roster non disponibile');
        const page = person.profilePage === 'staff_details.html' ? 'staff_details.html' : 'roster_details.html';
        const params = new URLSearchParams({giocatore: person.profileSlug, stagione: season});
        const photo = BrewersSafe.cssImage(person.imagePath || 'images/logo_brewers_trimmed.png');
        const role = staffRoles.get(row.roleId);
        return `
          <div class="card${person.imagePath ? '' : ' card-placeholder'}" style="background-image:url('${photo}')">
            <a href="./${page}?${BrewersSafe.escape(params.toString())}">
              <div class="card-content">
                ${Number.isInteger(row.jerseyNumber) ? `<div class="number">#${row.jerseyNumber}</div>` : ''}
                <div class="name">${BrewersSafe.escape(person.name)}</div>
                ${role ? `<div class="role">${role}</div>` : ''}
              </div>
            </a>
          </div>`;
      }).join('');
    }

    function renderStaff(staff, people, season) {
      const filters = document.getElementById('staff-role-filters');
      const roles = [...new Set(staff.map(row => row.roleId))].filter(role => staffRoles.has(role));
      filters.replaceChildren();
      filters.hidden = roles.length < 2;
      renderCards('staff-grid', staff, people, season);
      if (filters.hidden) return;
      for (const role of ['all', ...roles]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = role === 'all' ? 'Tutti' : staffRoles.get(role);
        button.classList.toggle('active', role === 'all');
        button.setAttribute('aria-pressed', String(role === 'all'));
        button.addEventListener('click', () => {
          for (const item of filters.children) {
            item.classList.toggle('active', item === button);
            item.setAttribute('aria-pressed', String(item === button));
          }
          renderCards('staff-grid', staff.filter(row => role === 'all' || row.roleId === role), people, season);
        });
        filters.append(button);
      }
    }

    Promise.all(['identities', 'roster', 'categories'].map(loadRosterData))
      .then(([archive, roster, catalog]) => {
        const people = new Map(archive.people.map(person => [person.personId, person]));
        const categories = new Map(catalog.categories.map(category => [category.id, category]));
        const seasons = [...roster.seasons].sort((a, b) => b.seasonId.localeCompare(a.seasonId));
        const choices = seasons.map(({seasonId}, i) => ({
          id: seasonId, label: seasonId.replace('-', '/'), order: (i + 1) * 10,
        }));
        choices.push(...catalog.categories.filter(category => category.kind === 'recognition'));
        const options = choices.sort((a, b) => a.order - b.order).map(choice => new Option(choice.label, choice.id));
        select.replaceChildren(...options);

        function render() {
          const season = select.value;
          const category = categories.get(season);
          const showHistory = category?.kind === 'recognition';
          const memberships = roster.memberships.filter(row => row.seasonId === season);
          const players = categories.get('player')?.kind === 'membership'
            ? memberships.filter(row => row.categoryId === 'player') : [];
          const staff = categories.get('staff')?.kind === 'membership'
            ? memberships.filter(row => row.categoryId === 'staff') : [];
          const members = showHistory ? roster.recognitions.filter(row => row.categoryId === category.id) : [];
          if (showHistory) document.getElementById('roster-history-title').textContent = category.label;
          renderCards('players-grid', players, people, season);
          renderStaff(staff, people, season);
          renderCards('honorary_members-grid', members, people, 'all');
          document.getElementById('roster-players').hidden = showHistory || !players.length;
          document.getElementById('roster-staff').hidden = showHistory || !staff.length;
          document.getElementById('roster-history').hidden = !showHistory || !members.length;
          status.hidden = Boolean(players.length || staff.length || members.length);
          status.textContent = 'Nessun nominativo disponibile per questa selezione.';
        }

        const url = new URL(location.href);
        const requested = url.searchParams.get('stagione');
        select.value = options.some(option => option.value === requested) ? requested : catalog.currentSeasonId;
        select.addEventListener('change', () => {
          url.searchParams.set('stagione', select.value);
          history.replaceState(null, '', url);
          render();
        });
        render();
        select.disabled = false;
      })
      .catch(error => {
        console.error('Roster:', error);
        status.textContent = 'Roster temporaneamente non disponibile.';
      });
  </script>
</body>
</html>
