<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="shortcut icon" type="image/x-icon" href="../images/logo_brewers_trimmed.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsor - Brewers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    @font-face {
      font-family: 'Strike Fighter Laser';
      src: url('https://raw.githubusercontent.com/sverza/Brewers/main/Font/strikefighterlaser.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }
    :root{
      --bg:#0a0a0a; --panel:#0b0b0b; --accent:#00aaff; --text:#ffffff;
      --muted:#c7c7c7; --card:#ffffff; --ink:#000000; --shadow:0 4px 12px rgba(0,0,0,0.12);
    }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; height:auto; }
    button{ cursor:pointer; border:none; background:none; color:inherit; }
    #header-container,#footer-container{ width:100%; }
    #header-container{ position:sticky; top:0; z-index:1000; background:#090909; }

    /* SOCIAL */
    .social-vertical{ display:grid; grid-template-columns:repeat(5,1fr); gap:1rem; padding:2rem 1rem; box-sizing:border-box; }
    .social-block{ position:relative; height:260px; overflow:hidden; text-align:center; cursor:pointer; border-radius:12px; transition:transform .3s ease; outline:1px solid rgba(255,255,255,.06); }
    .social-block .bg-image{ position:absolute; inset:0; background-size:cover; background-position:center; z-index:0; transition:transform .4s ease; }
    .social-block::before{ content:""; position:absolute; inset:0; background-color:rgba(0,0,0,.55); z-index:1; }
    .social-block .content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%; color:#fff; padding:1rem; box-sizing:border-box; }
    .social-block i{ font-size:3rem; margin-bottom:.8rem; color:#9AD7F3; }
    .social-block p{ margin:0; font-size:1rem; padding:0 1rem; color:#eee; }
    .social-block:hover .bg-image{ transform:scale(1.1); }
    @media (max-width:1024px){ .social-vertical{ grid-template-columns:repeat(2,1fr); } .social-block:first-child{ grid-column:1 / -1; } }
    @media (max-width:600px){
      .social-vertical{ grid-template-columns:repeat(2,1fr); gap:.75rem; padding:1.5rem; }
      .social-block{ height:180px; } .social-block i{ font-size:2.2rem; } .social-block p{ font-size:.85rem; }
      .social-block:first-child{ grid-column:1 / -1; }
    }

    /* INSTAGRAM FEED */
    .instagram-feed{ padding:3rem 1rem; text-align:center; background:radial-gradient(ellipse at top, rgba(220,39,67,.10), transparent 60%); }
    .instagram-feed h2{ color:#fff; font-family:'Strike Fighter Laser',sans-serif; font-size:1.8rem; margin:0 0 .6rem; }
    .instagram-feed .ig-subtitle{ color:var(--muted); font-size:.95rem; margin:0 0 2rem; }
    .instagram-feed-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.75rem; max-width:1200px; margin:0 auto; justify-items:center; align-items:start; }
    .instagram-card{ position:relative; width:100%; max-width:360px; border-radius:22px; padding:3px; background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); box-shadow:0 10px 26px rgba(0,0,0,.45); transition:transform .35s ease, box-shadow .35s ease; }
    .instagram-card:hover{ transform:translateY(-8px) scale(1.02); box-shadow:0 18px 40px rgba(0,0,0,.6); }
    .instagram-card-inner{ background:#0b0b0b; border-radius:19px; overflow:hidden; padding:12px 12px 4px; height:640px; display:flex; flex-direction:column; }
    .instagram-card-header{ display:flex; align-items:center; gap:.5rem; justify-content:center; color:#fff; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase; font-size:.78rem; padding:.3rem 0 .8rem; }
    .instagram-card-header i{ font-size:1.15rem; background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .instagram-card .instagram-media{ margin:0 auto !important; flex:1 1 auto !important; width:100% !important; overflow-y:auto !important; }
    @media (max-width:900px){ .instagram-feed-grid{ grid-template-columns:1fr; justify-items:center; } .instagram-card{ max-width:420px; } }

    </style>
</head>
<body>
  <div id="header-container"></div>

  <!-- SOCIAL -->
  <section class="social-vertical">
    <a href="https://www.instagram.com/brewersbasketballmilano" target="_blank" class="social-block">
      <div class="bg-image" style="background-image:url('../images/list_picture/DSC08708.jpg');"></div>
      <div class="content"><i class="fab fa-instagram"></i><p style="font-family:'Strike Fighter Laser',sans-serif;">Instagram</p></div>
    </a>
    <a href="https://whatsapp.com/channel/0029VasaUn7CBtxA6i1vhs2r" target="_blank" class="social-block">
      <div class="bg-image" style="background-image:url('../images/list_picture/DSC08720.jpg');"></div>
      <div class="content"><i class="fab fa-whatsapp"></i><p style="font-family:'Strike Fighter Laser',sans-serif;">Whatsapp</p></div>
    </a>
    <a href="https://www.tiktok.com/@brewersbasketballmilano" target="_blank" class="social-block">
      <div class="bg-image" style="background-image:url('../images/list_picture/DSC08944.jpg');"></div>
      <div class="content"><i class="fab fa-tiktok"></i><p style="font-family:'Strike Fighter Laser',sans-serif;">TikTok</p></div>
    </a>
    <a href="https://www.youtube.com/@sverza-x-brewers" target="_blank" class="social-block">
      <div class="bg-image" style="background-image:url('../images/list_picture/DSC08947.jpg');"></div>
      <div class="content"><i class="fab fa-youtube"></i><p style="font-family:'Strike Fighter Laser',sans-serif;">YouTube</p></div>
    </a>
    <a href="https://https://www.linkedin.com/company/brewers-basket-asd" target="_blank" class="social-block">
      <div class="bg-image" style="background-image:url('../images/list_picture/DSC08875.jpg');"></div>
      <div class="content"><i class="fab fa-linkedin"></i><p style="font-family:'Strike Fighter Laser',sans-serif;">LinkedIn</p></div>
    </a>
  </section>

  <!-- INSTAGRAM FEED -->
  <section class="instagram-feed">
    <h2>I nostri ultimi post Instagram</h2>
    <p class="ig-subtitle">Seguici su Instagram per non perderti nulla</p>
    <div class="instagram-feed-grid">
      <div class="instagram-card">
        <div class="instagram-card-inner">
          <div class="instagram-card-header"><i class="fab fa-instagram"></i> Post</div>
          <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DbLFaPrIpFw/" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin:1px; max-width:540px; min-width:326px; padding:0; width:99%;"></blockquote>
        </div>
      </div>
      <div class="instagram-card">
        <div class="instagram-card-inner">
          <div class="instagram-card-header"><i class="fab fa-instagram"></i> Post</div>
          <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DZUv1wYiMym/" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin:1px; max-width:540px; min-width:326px; padding:0; width:99%;"></blockquote>
        </div>
      </div>
      <div class="instagram-card">
        <div class="instagram-card-inner">
          <div class="instagram-card-header"><i class="fab fa-instagram"></i> Post</div>
          <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DYwruftI5dY/" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15); margin:1px; max-width:540px; min-width:326px; padding:0; width:99%;"></blockquote>
        </div>
      </div>
    </div>
  </section>
  <script async src="https://www.instagram.com/embed.js"></script>

  <div id="footer-container"></div>

  <script>
    // Header/Footer
    fetch('https://raw.githubusercontent.com/sverza/Brewers/main/widget/brewers_header.html')
      .then(r=>{ if(!r.ok) throw new Error('Errore header'); return r.text(); })
      .then(html=>{
        document.getElementById('header-container').innerHTML=html;
        const script = document.createElement("script");
        script.src = "/ServerCode/brewers_header.js";
        document.body.appendChild(script);
        // Bind del menu mobile
        const icon = document.getElementById('menu-icon');
        const iconFixed = document.getElementById('menu-icon-fixed');
        const menu = document.getElementById('brewers-menu');
        const overlay = document.getElementById('menu-overlay');
        function toggleMenu(){
          if(!menu||!overlay) return;
          const opening = !menu.classList.contains('open');
          menu.classList.toggle('open');
          overlay.classList.toggle('active');
          if(icon) icon.classList.add('bounce');
          if(iconFixed) iconFixed.classList.add('bounce');
          setTimeout(()=>{ icon&&icon.classList.remove('bounce'); iconFixed&&iconFixed.classList.remove('bounce'); },500);
          if(iconFixed) iconFixed.style.display = opening ? 'block' : 'none';
        }
        icon && icon.addEventListener('click', toggleMenu);
        iconFixed && iconFixed.addEventListener('click', toggleMenu);
        overlay && overlay.addEventListener('click', ()=>{
          menu && menu.classList.remove('open');
          overlay && overlay.classList.remove('active');
          if(iconFixed) iconFixed.style.display='none';
        });
      })
      .catch(err=>console.error('Header:',err));
    
    fetch('https://raw.githubusercontent.com/sverza/Brewers/main/widget/brewers_footer.html')
      .then(r=>r.text()).then(d=>document.getElementById('footer-container').innerHTML=d);

    </script>
</body>
</html>
