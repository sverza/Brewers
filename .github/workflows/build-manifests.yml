name: Rigenera manifest partite/articoli

# Il sito legge partite/manifest.json e articoli_per_news/manifest.json
# al posto di interrogare dal vivo l'API GitHub (che ha un limite di 60
# richieste/ora per IP non autenticato ed era la causa dei "Rate limit
# exceeded"). Questo workflow tiene quei manifest sempre allineati ai
# file presenti nel repo, così aggiungere/modificare una partita o un
# articolo non richiede alcun passaggio manuale: basta fare il commit
# dei file come sempre.

on:
  push:
    branches: [main]
    paths:
      - 'partite/**'
      - 'articoli_per_news/**'
      - 'scripts/build_manifests.py'
      - '.github/workflows/build-manifests.yml'
      - '!partite/manifest.json'
      - '!articoli_per_news/manifest.json'
  workflow_dispatch: {}
  schedule:
    # Rete di sicurezza settimanale, nel caso qualche modifica non abbia
    # attivato correttamente il trigger sopra.
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build-manifests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Genera i manifest
        run: python3 scripts/build_manifests.py

      - name: Commit se ci sono cambiamenti
        run: |
          if git diff --quiet -- partite/manifest.json articoli_per_news/manifest.json; then
            echo "Nessun cambiamento, manifest già aggiornati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add partite/manifest.json articoli_per_news/manifest.json
          git commit -m "chore: aggiorna manifest partite/articoli [skip ci]"
          git push
