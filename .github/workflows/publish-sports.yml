name: Pubblica export sportivo validato

on:
  workflow_dispatch:
    inputs:
      activate_source:
        description: Prima attivazione consumer, solo dopo autorizzazione finale
        type: boolean
        default: false
      require_daily_ready:
        description: Usa lo stesso controllo del run giornaliero
        type: boolean
        default: false
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-static-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.SPORTS_PUBLICATION_ENABLED == 'true'
    environment: sports-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # WIF: short-lived identity, no service-account key or user refresh token.
      # This identity gets Drive read access ONLY to the sanitized outbox folder.
      - uses: google-github-actions/auth@v3
        id: google
        with:
          workload_identity_provider: ${{ vars.SPORTS_WIF_PROVIDER }}
          service_account: ${{ vars.SPORTS_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Scarica soltanto artefatto pubblico e verifica
        id: transfer
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SPORTS_REQUIRE_DAILY_READY: ${{ github.event_name == 'schedule' || inputs.require_daily_ready == true }}
          SPORTS_POINTER_ID: ${{ vars.SPORTS_POINTER_ID }}
          SPORTS_OUTBOX_FOLDER_ID: ${{ vars.SPORTS_OUTBOX_FOLDER_ID }}
          SPORTS_PRODUCER_SCRIPT_ID: ${{ vars.SPORTS_PRODUCER_SCRIPT_ID }}
          SPORTS_DOWNLOAD_FILE: ${{ runner.temp }}/sports-approved.json
        run: node scripts/sports-publication.mjs download
      - name: Prepara release statica e pubblica solo se cambiata
        id: publication
        if: steps.transfer.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPORTS_DOWNLOAD_FILE: ${{ runner.temp }}/sports-approved.json
          SPORTS_ACTIVATE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_source }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SPORTS_ACTIVATE_SOURCE" = true ]; then
            node scripts/prepare-sports-release.mjs "$SPORTS_DOWNLOAD_FILE" --apply-after-go-live-approval
          else
            node scripts/sports-publication.mjs assert-active
            node scripts/sports-publication.mjs prepare
          fi
          release=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.env.SPORTS_DOWNLOAD_FILE)).artifact.current.releaseId)")
          echo "release=$release" >> "$GITHUB_OUTPUT"
          git add -- ServerCode/sports-source.js sports/v1/current.json "sports/v1/releases/$release/"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A human push in the meantime is a safe failure, never a force/rebase.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: aggiorna export sportivo validato [skip ci]'
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > "$RUNNER_TEMP/pages-build.json"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verifica i JSON effettivamente serviti da Pages
        if: steps.transfer.outputs.ready == 'true'
        env:
          SPORTS_PUBLIC_ORIGIN: https://www.brewersbasketball.it/
          SPORTS_EXPECTED_RELEASE: ${{ steps.publication.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if node scripts/sports-publication.mjs verify; then exit 0; fi
            sleep 20
          done
          echo 'Pages non verificato: controllare deploy e cache; non dichiarare successo.' >&2
          exit 1
